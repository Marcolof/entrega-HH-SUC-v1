schema_version: "0.1"
last_updated: "2026-09-17"

project:
  name: "Entrega HH SUC"
  client: "Correo Argentino"
  scenario: evolution
  local_root: "."
  constraint: "Todo el proyecto (codigo, docs fuente, documentacion generada) vive dentro de esta carpeta. Es la unica que se sube a GitHub. docs/ se movio para adentro el 2026-08-27, antes vivia como hermana fuera del repo"

strategy:
  current_focus: "Reencuadre a PROPUESTA UNICA (2026-09-17). Presentacion ya migrada; documentacion todavia habla de P1 y P2"
  intervention: reuse-existing
  recommended_next:
    - "Migrar la documentacion a propuesta unica: retirar Documents/propuesta-2-usuarios-genericos.md, reescribir propuesta-1 como 'la propuesta', reencuadrar reporte-impacto y functional-analysis, actualizar app/documentacion/docs.ts y la tarjeta 04 del Hub (hoy dice 'las dos propuestas en igualdad de jerarquia', sigue siendo cierto hasta que se migre)"
    - "Agregar ISO/IEC 27001 (ABM de usuarios y roles) tambien en la documentacion, como esta en la Presentacion"
    - "Regenerar el PPTX desde el deck nuevo de 14 slides (el actual sigue siendo el de 16 slides con P1 vs P2)"
    - "Construir /flujo con el diagrama real de pantallas/roles (unico modulo pendiente del Hub)"
  deferred:
    - "Modulo /flujo del Hub (placeholder, sin contenido)"
    - "Documentar en OpenSpec el flujo de entrega, historial y ABM (solo existe login-y-roles)"
    - "Reglas de baja de stock, P80 y devolucion: dependen de definicion del negocio"

knowledge:
  confirmed:
    - "DECISION (superior, 2026-08-27): la Presentacion no debe revelar al cliente que ya existe un prototipo navegable. Se elimino toda mencion a 'prototipo'/'wireframe' del HTML y del PPTX (mockup de login, tarjeta 'Asimetria', texto de cierre). El boton 'Volver al hub' se mantiene en el HTML (uso interno, se omite naturalmente al exportar a PPTX)"
    - "El logo real de Correo Argentino (assets/logo correo argentino.svg, tambien en public/) reemplazo todos los badges placeholder 'CA' en el Hub, prototipo y HTML de presentacion. Pendiente en el PPTX: este entorno no tiene herramienta de rasterizacion SVG->PNG (sharp/canvas/resvg/puppeteer ausentes, npm install sin registry); el PPTX conserva el badge circular 'CA' dibujado por pptxgenjs"
    - "GLOSARIO (usuario, 2026-08-27): T&T = listado de eventos de la pieza/envio + forma de seguimiento (usuario no conoce el detalle interno). Mosaic = sistema de punto de venta VIEJO, la sucursal carga ahi los eventos que recibe via T&T. P80 = un evento de T&T. Ver Documents/glosario-dominio.md"
    - "Mosaic es un sistema real y vigente (ya no depende solo del GC01 deprecado). Pero esto NO confirma que HH SUC pueda integrarse con el - ver open_questions, es bloqueante de arquitectura"
    - "DECISION (2026-09-17, deroga la de igualdad de jerarquia): queda UNA SOLA PROPUESTA, la ex Propuesta 1 (app web con usuario nominal). Ya no se habla de v1/v2 ni de 'Propuesta 1': es 'la propuesta'. La ex Propuesta 2 sale de la narrativa"
    - "DECISION (2026-09-17): la Presentacion no menciona ningun punto a definir, contradiccion ni hueco. Se elimino el slide 'Preguntas abiertas' y la cita al documento deprecado. Todo eso va en la Documentacion, que es el artefacto donde vive lo no resuelto"
    - "DECISION (2026-09-17): el ABM de usuarios y roles se presenta como cumpliendo la norma ISO/IEC 27001. Numero de norma verificado: ISO/IEC 27001 es el estandar certificable de gestion de seguridad de la informacion (SGSI). Controles de gestion de accesos del Anexo A (version 2022): A.5.15 control de acceso, A.5.16 gestion de identidad (identidad unica, nunca compartida), A.5.17 informacion de autenticacion, A.5.18 derechos de acceso. A.5.16 es el que respalda directamente el usuario nominal contra el generico compartido"
    - "El GC01 esta deprecado, no eliminado: no se derivan requisitos de el, pero se consulta para explicar huecos de P1 y P2"
    - "El prototipo es la Propuesta 1 materializada: cobertura completa de sus 6 pasos y sus 2 precondiciones"
    - "Propuesta 1 exige como precondicion ABM de usuarios con asignacion a unidad de negocio y ABM de roles y perfiles: ambos estan implementados"
    - "El diagrama image.png documenta la mecanica de la Propuesta 2 (usuario generico, tareas, P80), porque esa propuesta declara 'el proceso seria el mismo al actual'"
    - "Al deprecar el GC01 se disuelve la contradiccion de dispositivo: cada propuesta trae el suyo (P1 = PC/Tablet, P2 = movil HH)"
    - "El documento fuente no es neutral: a P1 le da beneficios y cero limitantes, a P2 seis limitantes y cero beneficios"
  assumptions:
    - "El modulo Historial es un agregado del equipo de diseno: no aparece en ninguna de las dos propuestas"
    - "El ingreso de la pieza se resolvio como codigo manual; la fuente no define el medio"
    - "El rol Supervisor es una decision de diseno, no un requisito de las fuentes"
  open_questions:
    - "BLOQUEANTE DE ARQUITECTURA: puede la solucion HH SUC comunicarse con Mosaic? El analista del cliente no lo dejo claro. No es un detalle de redaccion, condiciona el diseno de integraciones"
    - "Falla de integracion post-confirmacion: que ocurre si falla despues de confirmar la entrega. Limitante declarada por la fuente para esta propuesta, sin resolucion definida"
    - "HH: es el dispositivo, el tipo de evento, o ambos? (usuario no esta seguro)"
    - "Que significa 'palabra clave / operador RMS' en la carga de eventos a Mosaic?"
    - "'Dispositivos' = hardware, o 'cualquier cosa que llega a una sucursal' (items/envios)? Hipotesis del usuario sin verificar"
    - "La foto de DNI en el formulario de Office Core aplica a este proyecto, o es de otro proceso? (usuario no esta seguro)"
    - "Historial y Supervisor quedan dentro del alcance aceptado? La propuesta no los menciona"
    - "Cuando se envia la novedad de baja de stock y cuando no (bifurcacion del diagrama del proceso)"
    - "Circuito de devolucion (MOTIVOS DEVOLUCION -> BAJA OFFICE CORE) entra en el alcance de la propuesta?"

sources:
  - type: docx
    path: "docs/Dos ideas como propuestas  (2).docx"
    role: "FUENTE DE VERDAD PRINCIPAL. Dos alternativas de solucion"
    authority: high
    date: unknown
    note: "No es neutral: califica a Propuesta 1 como 'la mas factible', le da beneficios y ninguna limitante; a Propuesta 2 le da seis limitantes y ningun beneficio"
  - type: image
    path: "docs/image.png"
    role: "FUENTE DE VERDAD. Diagrama del proceso tentativo. Funciona como vista de proceso de la Propuesta 2"
    authority: high
    note: "Rotulado PROCESO TENTATIVO: sus ramas son intencion de proceso, no reglas confirmadas"
  - type: docx
    path: "docs/GC01-Entrega con HH SUC V2 (1).docx"
    role: "DEPRECADO, no eliminado. Etapa inicial del proceso. No se usa para derivar requisitos, pero se consulta para explicar huecos de P1 y P2"
    authority: deprecated
    date: "2026-07-20"
    note: "Unica fuente de: motivacion del cambio, doble proceso actual, pasividad de errores, alcance 'toda oficina', y Mosaic. Ver reporte-impacto seccion 1.5"
  - type: markdown
    path: "Documents/functional-analysis.md"
    role: "Analisis funcional del equipo. En revision tras el reencuadre de fuentes"
    authority: medium
  - type: chat-notes
    path: "Documents/glosario-dominio.md"
    role: "Conocimiento de dominio del usuario (T&T, HH, P80, Mosaic, Office Core), transmitido en chat, no documento formal del cliente"
    authority: medium
    date: "2026-08-27"
    note: "Confirma Mosaic de forma independiente al GC01 deprecado. Incompleto: listado de dispositivos y listado de eventos quedaron a medio escribir"

