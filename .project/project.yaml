  hub:
    status: review
    path: "app/page.tsx"
    note: "4 tarjetas. Tarjetas 01 (Prototipo) y 03 (Presentacion) ya migradas a propuesta unica. La 04 (Documentacion) todavia dice 'las dos propuestas en igualdad de jerarquia' porque los .md siguen asi: se actualiza cuando se migre documentacion. Solo Flujo sigue placeholder"
  presentation:
    status: current
    path: "app/presentacion/ (selector Next.js) + public/presentaciones/propuesta-entrega-hh-suc.html (deck autocontenido)"
    note: "13 slides, propuesta unica, verificado en localhost 2026-09-17. Estilo navy #152663 / amarillo #FFCE00 / Ubuntu. Sin capturas ni iframes (decision de no revelar el prototipo al cliente). Incluye slide 10 dedicado a ABM de usuarios y roles segun ISO/IEC 27001 con los controles A.5.15-A.5.18. El deck anterior propuestas-1-y-2.html se elimino (recuperable en commit 17c2349)"
  prototype:
    status: review
    fidelity: wireframe
    path: "app/prototype/page.tsx"
    note: "Incluye panel de prueba (esquina inferior derecha): volver al hub, cambiar tipo de usuario y alternar escritorio / responsive"
  documentation:
    status: stale
    path: "Documents/"
    note: "DESACTUALIZADA tras la decision de propuesta unica del 2026-09-17: sigue documentando P1 y P2 en igualdad y no menciona ISO/IEC 27001. Es el proximo trabajo pendiente"
  proposals:
    status: stale
    path: "Documents/propuesta-1-aplicacion-web-nominal.md, Documents/propuesta-2-usuarios-genericos.md"
    sources: "docs/Dos ideas como propuestas (2).docx, docs/image.png"
    note: "propuesta-2 debe retirarse y propuesta-1 pasar a ser 'la propuesta'"
  impact_report:
    status: stale
    path: "Documents/reporte-impacto-propuestas.md"
    note: "Su tesis central es comparar las dos propuestas: hay que reencuadrarlo o retirarlo"
  presentation_pptx:
    status: current
    path: "Documents/Propuesta-Entrega-HH-SUC.pptx"
    note: "13 slides, espejo exacto del deck HTML, verificado por extraccion de texto del XML el 2026-09-17. Se regenera a pedido, no en cada cambio (pedido explicito del usuario). Generador en scratchpad/pptxgen/build.js + logo.png (copia de 'public/presentaciones/assets presentations/Logo presentacion.png'). El anterior Propuesta-1-vs-Propuesta-2.pptx se elimino: el nombre del archivo por si solo filtraba la existencia de una segunda alternativa"
  status_report:
    status: current
    path: "Documents/reporte-estado-propuesta-unica.md"
    note: "Reporte para analistas: contradicciones, riesgos, 12 puntos abiertos y mejoras. INTERNO A PROPOSITO: no esta registrado en app/documentacion/docs.ts, por lo que no se publica en /documentacion"
  specs:
    status: stale
    path: "openspec/specs/login-y-roles/spec.md"
    note: "Solo cubre login y roles. Quedo desactualizada: no contempla el cambio de rol desde el panel de prueba sin cerrar sesion"

